<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERPulse - 가까운 응급실 찾기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    color: #1a1a1a;
    background: linear-gradient(180deg, #fff5f5 0%, #ffffff 220px);
    min-height: 100vh;
  }
  .header { text-align: center; margin-bottom: 32px; }
  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 3px solid #e63946;
    border-radius: 999px;
    padding: 8px 22px 8px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(230, 57, 70, 0.2);
  }
  .cross {
    color: #e63946;
    font-size: 26px;
    font-weight: 900;
    line-height: 1;
  }
  .brand {
    font-size: 20px;
    font-weight: 800;
    color: #e63946;
    letter-spacing: 0.5px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
  .subtitle { color: #888; font-size: 14px; margin: 0; }

  .search-box { text-align: center; margin-bottom: 24px; }
  button {
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #e63946;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(230, 57, 70, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(230, 57, 70, 0.45); }
  button:active { transform: translateY(0); }
  button:disabled { background: #ccc; box-shadow: none; cursor: default; }

  #status {
    text-align: center;
    margin: 16px 0;
    color: #888;
    font-size: 14px;
    min-height: 20px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #ddd;
    border-top-color: #e63946;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hospital {
    position: relative;
    border: 1px solid #f0f0f0;
    border-radius: 14px;
    padding: 18px 18px 18px 56px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: box-shadow 0.15s ease;
  }
  .hospital:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); }
  .rank {
    position: absolute;
    left: 16px; top: 18px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fdecea;
    color: #e63946;
    font-size: 13px;
    font-weight: 800;
    line-height: 26px;
    text-align: center;
  }
  .hospital h3 { margin: 0 0 8px; font-size: 16px; }
  .hospital .meta { color: #666; font-size: 13px; line-height: 1.7; }
  .bed {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .dist {
    display: inline-block;
    background: #f1f3f5;
    color: #495057;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }

  .empty { text-align: center; color: #aaa; font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <span class="cross">✚</span>
      <span class="brand">ERPulse</span>
    </div>
    <h1>가까운 응급실 찾기</h1>
    <p class="subtitle">현재 위치 기준, 가용 병상이 있는 응급실만 보여드려요</p>
  </div>

  <div class="search-box">
    <button id="searchBtn">🔍 내 위치로 검색</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>

<script>
const API_BASE = "http://ab0f0f54a4eb247d9b99806683c98ac1-647535385.ap-northeast-2.elb.amazonaws.com";

const btn = document.getElementById("searchBtn");
const status = document.getElementById("status");
const results = document.getElementById("results");

btn.addEventListener("click", () => {
  results.innerHTML = "";
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>위치 확인 중...';

  if (!navigator.geolocation) {
    status.textContent = "이 브라우저는 위치 정보를 지원하지 않아요.";
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    status.innerHTML = '<span class="spinner"></span>가까운 응급실 조회 중...';

    try {
      const res = await fetch(`${API_BASE}/hospitals/nearest?lat=${latitude}&lng=${longitude}&limit=5`);
      const hospitals = await res.json();

      if (hospitals.length === 0) {
        status.textContent = "";
        results.innerHTML = '<div class="empty">가용 병상이 있는 응급실을 찾지 못했어요.</div>';
        return;
      }

      status.textContent = `${hospitals.length}곳 찾았어요`;
      results.innerHTML = hospitals.map((h, i) => {
        return `
          <div class="hospital">
            <div class="rank">${i + 1}</div>
            <h3>${h.dutyName}</h3>
            <div class="meta">${h.dutyAddr ?? ""}</div>
            <div class="meta">${h.dutyTel1 ?? "-"}</div>
            <div class="meta" style="margin-top:8px;">
              <span class="dist">약 ${h.distance_km}km</span>
              <span class="bed">가용병상 ${h.hvec}개</span>
            </div>
          </div>`;
      }).join("");
    } catch (e) {
      status.textContent = "조회 실패: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }, () => {
    status.textContent = "위치 권한을 허용해주세요.";
    btn.disabled = false;
  });
});
</script>
</body>
</html>
